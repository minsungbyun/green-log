<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식물 등록 · AI 식물관찰일지</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-main">🌱 그린로그</span>
        <span class="logo-sub">AI와 함께 기록하는 나의 식물 성장일지</span>
      </a>
      <nav class="nav">
        <a href="/">홈</a>
        <a href="/plants.html" class="active">식물 등록</a>
        <a href="/journal.html">관찰일지 작성</a>
        <a href="/list.html">기록 보기</a>
        <a href="/stats.html">통계</a>
        <a href="/mcp.html">MCP</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">식물 등록</h1>

    <section class="card">
      <h2>새 식물 추가</h2>
      <form id="plant-form" class="form-grid">
        <label>
          <span class="label-text"><span class="req">*</span> 식물 종류</span>
          <select id="speciesSelect">
            <option value="">-- 종류 선택 --</option>
          </select>
        </label>
        <label>
          <span class="label-text"><span class="req">*</span> 식물명</span>
          <select id="nameSelect" disabled>
            <option value="">먼저 종류를 선택하세요</option>
          </select>
        </label>
        <label class="full" id="customSpeciesBox" hidden>
          종류 직접 입력
          <input type="text" id="customSpeciesInput" placeholder="예: 다육이 변종" />
        </label>
        <label class="full" id="customNameBox" hidden>
          식물명 직접 입력
          <input type="text" id="customNameInput" placeholder="예: 우리 집 바질" />
        </label>
        <label>키우는 장소
          <select id="locationSelect">
            <option value="">-- 장소 선택 --</option>
          </select>
        </label>
        <label>키우기 시작일
          <input type="date" name="startedAt" />
        </label>
        <label class="full" id="customLocationBox" hidden>
          장소 직접 입력
          <input type="text" id="customLocationInput" placeholder="예: 사무실 책상 위" />
        </label>
        <label class="full">초기 사진 (선택)
          <input type="file" id="plantPhotoInput" accept="image/*" />
          <small id="plantPhotoStatus" class="hint"></small>
          <div id="plantPhotoPreviewBox" hidden style="margin-top:8px">
            <img id="plantPhotoPreview" alt="초기 사진 미리보기" style="width:100%;max-width:240px;border-radius:10px;display:block" />
          </div>
        </label>
        <input type="hidden" name="name" id="plantName" />
        <input type="hidden" name="species" id="plantSpecies" />
        <input type="hidden" name="location" id="plantLocation" />
        <input type="hidden" name="photoUrl" id="plantPhotoUrl" />
        <div class="full" id="memoAIBox" hidden>
          <button type="button" id="btnGenMemo" class="btn btn-secondary">🤖 AI 메모 자동 생성</button>
          <small class="hint" style="display:block;margin-top:6px">
            종류·식물명·장소·시작일을 기반으로 AI가 메모 초안을 작성합니다.
          </small>
        </div>
        <div class="full" id="memoAINotice" hidden>
          <small class="hint">
            ℹ️ AI 메모 자동 생성을 사용하려면 서버 환경변수 <code>ANTHROPIC_API_KEY</code> 또는 <code>GOOGLE_API_KEY</code> 가 필요합니다.
          </small>
        </div>
        <label class="full">메모
          <textarea name="memo" id="memoTextarea" rows="3" placeholder="간단한 메모"></textarea>
        </label>
        <div class="form-actions full">
          <button type="submit" class="btn btn-primary">등록</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>등록된 식물</h2>
      <div id="plant-list" class="plant-list">불러오는 중...</div>
    </section>
  </main>

  <!-- 식물 수정 모달 -->
  <div id="plantEditModal" class="modal" hidden>
    <div class="modal-inner">
      <button class="modal-close" id="plantModalClose">×</button>
      <h2>식물 수정</h2>
      <form id="plant-edit-form" class="form-grid">
        <input type="hidden" name="id" />
        <label>
          <span class="label-text"><span class="req">*</span> 식물 종류</span>
          <select id="editSpeciesSelect">
            <option value="">-- 종류 선택 --</option>
          </select>
        </label>
        <label>
          <span class="label-text"><span class="req">*</span> 식물명</span>
          <select id="editNameSelect">
            <option value="">먼저 종류를 선택하세요</option>
          </select>
        </label>
        <label class="full" id="editCustomSpeciesBox" hidden>
          종류 직접 입력
          <input type="text" id="editCustomSpeciesInput" />
        </label>
        <label class="full" id="editCustomNameBox" hidden>
          식물명 직접 입력
          <input type="text" id="editCustomNameInput" />
        </label>
        <label>키우는 장소
          <select id="editLocationSelect">
            <option value="">-- 장소 선택 --</option>
          </select>
        </label>
        <label>키우기 시작일
          <input type="date" name="startedAt" />
        </label>
        <label class="full" id="editCustomLocationBox" hidden>
          장소 직접 입력
          <input type="text" id="editCustomLocationInput" />
        </label>
        <label class="full">사진 교체 (선택)
          <input type="file" id="plantEditPhotoInput" accept="image/*" />
          <small id="plantEditPhotoStatus" class="hint"></small>
        </label>
        <input type="hidden" name="name" id="editPlantName" />
        <input type="hidden" name="species" id="editPlantSpecies" />
        <input type="hidden" name="location" id="editPlantLocation" />
        <input type="hidden" name="photoUrl" id="plantEditPhotoUrl" />
        <div class="full" id="plantEditPhotoPreviewBox" hidden>
          <small class="hint">현재 사진:</small>
          <img id="plantEditPhotoPreview" alt="현재 사진" style="max-width:160px;border-radius:10px;display:block;margin-top:6px" />
        </div>
        <div class="full" id="editMemoAIBox" hidden>
          <button type="button" id="btnEditGenMemo" class="btn btn-secondary">🤖 AI 메모 자동 생성</button>
        </div>
        <label class="full">메모
          <textarea name="memo" id="editMemoTextarea" rows="3"></textarea>
        </label>
        <div class="form-actions full">
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container"><small>© AI 식물관찰일지</small></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/plant-catalog.js"></script>
  <script src="/js/plants.js"></script>
</body>
</html>
